name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  RUSTFLAGS: "-C link-arg=/DEBUG:NONE"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Verify compiler version
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          if ($version -notmatch '^rustc 1\.99\.1(?:\s|$)') {
            throw "Expected Rust 1.99.1, got $version"
          }

      - name: Install Cap'n Proto
        run: choco install capnproto --version=1.3.0 --no-progress -y

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Check heap profiling
        run: cargo check --locked -p desktop --features dhat-heap
