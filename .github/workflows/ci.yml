name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  RUSTFLAGS: "-C link-arg=/DEBUG:NONE"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Verify compiler version
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          if ($version -notmatch '^rustc 1\.99\.1(?:\s|$)') {
            throw "Expected Rust 1.99.1, got $version"
          }

      - name: Install Cap'n Proto
        run: choco install capnproto --version=1.3.0 --no-progress -y

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Check heap profiling
        run: cargo check --locked -p desktop --features dhat-heap
