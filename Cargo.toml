cargo-features = ["codegen-backend"]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
default-members = ["crates/desktop"]
members = [
    "crates/app-contracts",
    "crates/context",
    "crates/desktop",
    "crates/domain",
    "crates/ui",
    "crates/xtask",
]

[workspace.dependencies]
# --- guinea ---
guinea = "0.22.0"
guinea-meta-build = "0.22.0"

guinea-plugin-store = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }
guinea-plugin-l10n = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }
guinea-plugin-devtools = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }
guinea-plugin-single-instance = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }
guinea-widgets = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }
guinea-plugin-l10n-build = { git = "https://github.com/guinea-rs/guinea-plugins", rev = "2ddc8b3" }

# --- guicons ---
guicons = "0.11.0"
guicons-build = "0.11.0"

# --- amethystate ---
# Same minor as guinea-plugin-store's own amethystate dep: the store is a thin
# lid on it and re-exports it, so a minor apart means two incompatible Stores.
amethystate = "0.23.4"
amethystate-guinea = "0.23.4"

# --- windows-rs ---
windows-reactor = { package = "windows-reactor-pre", version = "0.101" }
windows-reactor-setup = "0.100"
windows-canvas = { package = "windows-canvas-pre", version = "0.101", features = ["reactor"] }
windows-collections = "0.100"
windows-core = "0.100"
windows-reference = "0.100"

# --- RPC & protocol ---
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.7.2" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.18.0" }
uniproc-windows-agent = { git = "https://github.com/uniproc-dev/uniproc-windows-agent", tag = "v0.22.0", default-features = false }

# --- Internal ---
app-contracts = { path = "crates/app-contracts" }
context = { path = "crates/context" }
domain = { path = "crates/domain" }
ui = { path = "crates/ui" }

capnp = "0.27"
capnp-rpc = "0.27"

# --- Async & Networking ---
tokio = { version = "1.49.0", features = ["full"] }
compio = { version = "0.18.0", features = ["net", "io-compat", "process", "macros", "time"] }
futures = "0.3.31"
flume = { version = "0.12.0", features = ["async"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- Utilities ---
anyhow = "1.0.100"
fluent-templates = "0.14.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }

[patch.crates-io]
guinea = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-app = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-codegen = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-core = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-macros = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-mark = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-meta = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-meta-build = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-route-dsl = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-router = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-trace = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
guinea-winui = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
windows-reactor-pre = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }
windows-canvas-pre = { git = "https://github.com/guinea-rs/guinea", rev = "01ce7f7" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# --- Profiles ---
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dhat]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0