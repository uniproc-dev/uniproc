[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
default-members = ["crates/desktop"]
members = [
    "crates/app-contracts",
    "crates/context",
    "crates/desktop",
    "crates/domain",
    "crates/table",
    "crates/ui",
    "crates/xtask",
]

[workspace.dependencies]
# --- guinea ---
guinea = "0.32.0"
guinea-meta-build = "0.32.0"

guinea-plugin-store = { path = "../guinea-plugins/plugins/store" }
guinea-plugin-l10n = { path = "../guinea-plugins/plugins/l10n" }
guinea-plugin-devtools = { path = "../guinea-plugins/plugins/devtools" }
guinea-plugin-single-instance = { path = "../guinea-plugins/plugins/single-instance" }
guinea-widgets = { path = "../guinea-plugins/widgets" }
guinea-plugin-l10n-build = { path = "../guinea-plugins/plugins/l10n-build" }

# --- guicons ---
guicons = { path = "../guicons/crates/guicons" }
guicons-build = { path = "../guicons/crates/guicons-build" }

# --- amethystate ---
amethystate = "0.29.0"
amethystate-guinea = "0.29.0"

# --- windows-rs ---
windows-reactor = { package = "windows-reactor-pre", version = "0.106" }
windows-reactor-setup = "0.100"
windows-canvas = { package = "windows-canvas-pre", version = "0.106", features = ["reactor"] }
windows-collections = "0.100"
windows-core = "0.100"
windows-numerics = "0.100"
windows-reference = "0.100"

# --- RPC & protocol ---
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.7.2" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.18.0" }
uniproc-windows-agent = { git = "https://github.com/uniproc-dev/uniproc-windows-agent", tag = "v0.24.0", default-features = false }

# --- Internal ---
app-contracts = { path = "crates/app-contracts" }
context = { path = "crates/context" }
domain = { path = "crates/domain" }
table = { path = "crates/table" }
ui = { path = "crates/ui" }

capnp = "0.27"
capnp-rpc = "0.27"

# --- Async & Networking ---
tokio = { version = "1.49.0", features = ["full"] }
compio = { version = "0.18.0", features = ["net", "io-compat", "process", "macros", "time"] }
futures = "0.3.31"
flume = { version = "0.12.0", features = ["async"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- Utilities ---
anyhow = "1.0.100"
hashbrown = "0.17.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[patch.crates-io]
guinea = { path = "../guinea/crates/guinea" }
guinea-app = { path = "../guinea/crates/guinea-app" }
guinea-codegen = { path = "../guinea/crates/guinea-codegen" }
guinea-core = { path = "../guinea/crates/guinea-core" }
guinea-macros = { path = "../guinea/crates/guinea-macros" }
guinea-mark = { path = "../guinea/crates/guinea-mark" }
guinea-meta = { path = "../guinea/crates/guinea-meta" }
guinea-meta-build = { path = "../guinea/crates/guinea-meta-build" }
guinea-router = { path = "../guinea/crates/guinea-router" }
guinea-trace = { path = "../guinea/crates/guinea-trace" }
guinea-winui = { path = "../guinea/crates/adapters/guinea-winui" }
windows-reactor-pre = { path = "../guinea/crates/vendor/windows-reactor-pre" }
windows-window-pre = { path = "../guinea/crates/vendor/windows-window-pre" }

# --- Profiles ---
[profile.release]
debug = 0
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dhat]
inherits = "release"
debug = "line-tables-only"
strip = false
split-debuginfo = "packed"

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0

[profile.bench]
debug = 0
