cargo-features = ["codegen-backend"]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
default-members = ["crates/desktop"]
members = [
    "crates/app-contracts",
    "crates/context",
    "crates/desktop",
    "crates/domain",
    "crates/ui",
    "crates/xtask",
]

[workspace.dependencies]
# --- guinea ---
guinea = { git = "https://github.com/uniproc-dev/guinea", tag = "v0.11.5" }

guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.16" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.16", features = ["winui"] }
guinea-plugin-devtools = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.16" }
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.16" }
guinea-plugin-l10n-build = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.16" }

# --- guinea-meta ---
guinea-meta-build = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }

# --- guicons ---
guicons = "0.6.0"
guicons-build = "0.6.0"

# --- amethystate ---
# Same minor as guinea-plugin-store's own amethystate dep: the store is a thin
# lid on it and re-exports it, so a minor apart means two incompatible Stores.
amethystate = "0.22.1"

# --- windows-rs ---
# Pinned to the exact rev guinea's own workspace pins, for the same reason
# guinea pins it: two separate lockfiles resolving an unpinned `git = "..."`
# dep independently can silently drift onto different commits.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = ["reactor"] }
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-reference = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }

# --- RPC & protocol ---
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.6.4" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.10.0" }
uniproc-windows-agent = { git = "https://github.com/uniproc-dev/uniproc-windows-agent", tag = "v0.7.1", default-features = false }

# --- Internal ---
app-contracts = { path = "crates/app-contracts" }
context = { path = "crates/context" }
domain = { path = "crates/domain" }
ui = { path = "crates/ui" }

capnp = "0.27"
capnp-rpc = "0.27"

raw-window-handle = "0.6.2"

# --- Async & Networking ---
tokio = { version = "1.49.0", features = ["full"] }
compio = { version = "0.18.0", features = ["net", "io-compat", "process", "macros", "time"] }
futures = "0.3.31"
flume = { version = "0.12.0", features = ["async"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- System & Platform ---
windows = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "UI_ViewManagement",
    "appmodel", "combaseapi", "dwmapi", "knownfolders", "minwindef", "objbase", "shellapi",
    "shlobj_core", "shobjidl_core", "windef", "wingdi", "winerror", "winuser",
] }

# --- Utilities ---
anyhow = "1.0.100"
fluent-templates = "0.14.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# guicons (pulled from crates.io) declares its own optional
# `windows-reactor` dependency as a plain crates.io version (crates.io
# strips the git/rev spec on publish, requiring *some* version) - since
# windows-reactor was never actually published there, that edge needs
# its own patch redirecting it to the same git rev pinned above (Cargo
# doesn't chain one [patch] block's target through another, so this has
# to name the same rev by hand, not just point at the git source).
[patch.crates-io]
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }

# --- Profiles ---
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dhat]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
