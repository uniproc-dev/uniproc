[defaults]
root = "assets/ui"
paint = "none"

[docker]
iconify = "mdi:docker"
paint = { light = "#1a1a1a", dark = "#ffffff" }

[linux]
iconify = "flat-color-icons:linux"

[ubuntu]
iconify = "logos:ubuntu"

[centos]
iconify = "logos:centos-icon"

[debian]
iconify = "logos:debian"

[fedora]
iconify = "logos:fedora"

[windows]
file = "windows.svg"

[windows-11]
file = "windows-11.svg"

[wsl]
file = "wsl.svg"
